name: zijing-esports
services:
  db:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: zijing
      POSTGRES_USER: zijing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zijing -d zijing"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    environment:
      APP_ENV: ${APP_ENV:-staging}
      DATABASE_URL: postgresql://zijing:${POSTGRES_PASSWORD}@db:5432/zijing
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set a unique Payload secret}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set the exact site origin}
      SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set the exact site origin}
      DB_PUSH: "false"
      MEDIA_DIR: /app/media
      BACKUP_DEST: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PRESIDENT_CLAIM_EMAIL: ${PRESIDENT_CLAIM_EMAIL:-}
      PRESIDENT_CLAIM_ACCOUNT: ${PRESIDENT_CLAIM_ACCOUNT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - media:/app/media
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
volumes:
  database:
  media:
  backups:
